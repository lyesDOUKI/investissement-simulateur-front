      properties:
        instrumentKind:
          type: string
          description: Type de support
          enum:
          - UNIT_LINKED
          - EURO_FUND
        isin:
          type:
          - string
          - "null"
          description: ISIN de l'unité de compte
        name:
          type: string
          description: "Nom connu du support, ou son identifiant si aucun nom n'est\
            \ disponible"
        invested:
          type: number
          description: Capital investi sur ce support
          example: 3100.0
        shares:
          type:
          - number
          - "null"
          description: Parts détenues ; null si elles ne peuvent pas être déterminées
        value:
          type:
