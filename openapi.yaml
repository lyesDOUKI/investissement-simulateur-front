      type: object
      description: Résumé du portefeuille valorisé à la date demandée
      properties:
        valuationDate:
          type: string
          format: date
          description: Date de référence de la valorisation
          example: 2026-11-16
        currency:
          type: string
          description: Devise de tous les montants
          example: EUR
        valuationStatus:
          type: string
          description: "COMPLETE si toutes les lignes sont valorisées, PARTIAL sinon"
          enum:
          - COMPLETE
          - PARTIAL
        totals:
          $ref: "#/components/schemas/PortfolioSummaryTotals"
        holdings:
          type: array
          description: Répartition par support détenu à la date de référence
          items:
            $ref: "#/components/schemas/PortfolioHoldingResponse"
        dcaPlans:
          type: array
          description: Plans DCA configurés à la date de référence
          items:
            $ref: "#/components/schemas/PortfolioDcaPlanResponse"
        recentActivity:
          type: "null"
          $ref: "#/components/schemas/PortfolioRecentActivityResponse"
          description: Activité enregistrée la plus récente à la date de référence
    PortfolioSummaryTotals:
      type: object
      description: Totaux calculés par le domaine
      properties:
        invested:
          type: number
          description: Capital effectivement investi à la date de valorisation
          example: 5400.0
        value:
          type:
          - number
          - "null"
          description: "Valeur totale en COMPLETE ; en PARTIAL, somme des lignes disponibles.\
            \ Null si aucune ligne ne peut être valorisée"
          example: 5600.0
        gain:
          type:
          - number
          - "null"
          description: Gain ou perte ; null si la valorisation est partielle
          example: 200.0
        gainRatePct:
          type:
