          example: 300.0
        date:
          type: string
          format: date
          description: Date de début du plan
          example: 2026-06-01
        executionDay:
          type: integer
          format: int32
          description: Jour d'exécution souhaité (1 à 31)
          example: 5
          maximum: 31
          minimum: 1
        delayBusinessDays:
          type: integer
          format: int32
          description: Décalage d'exécution en jours ouvrés
          example: 2
          maximum: 365
          minimum: 0
        allocations:
          type: array
