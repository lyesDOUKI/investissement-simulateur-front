        \ l'identifiant du versement ; pour DCA_INSTALLMENT, c'est l'identifiant du\
        \ plan DCA. Les deux identifiants ouvrent leur route GET correspondante."
      properties:
        type:
          type: string
          description: Type d'opération
          enum:
          - ONE_TIME_PAYMENT
          - DCA_INSTALLMENT
        operationId:
          type: string
          format: uuid
          description: Identifiant du versement unique ou du plan DCA à ouvrir selon
            type
        date:
          type: string
          format: date
          description: Date d'exécution enregistrée
        amount:
          type: number
          description: Montant de l'opération
        label:
          type: string
          description: Libellé destiné à l'affichage
        detail:
          type: string
          description: Détail du nombre de supports
