          example: 2026-09-01
        paymentDay:
          type: integer
          format: int32
          description: Jour du mois prévu pour le prélèvement
          example: 10
        businessDayDelay:
          type: integer
          format: int32
          description: Délai configuré en jours ouvrés
          example: 3
